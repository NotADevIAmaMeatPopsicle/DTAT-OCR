[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Start with correctness rules so CI catches syntax errors and undefined names
# without turning the release cleanup into an unrelated style rewrite.
select = ["E9", "F63", "F7", "F82"]
