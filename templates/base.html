<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DTAT OCR{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' font-family='Arial,sans-serif' font-weight='700' fill='white'%3EDT%3C/text%3E%3C/svg%3E">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX for dynamic interactions -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>

    <!-- Custom styles -->
    <style>
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: inline-block;
        }
        .htmx-request.htmx-indicator {
            display: inline-block;
        }
        .drop-zone {
            border: 2px dashed #cbd5e1;
            transition: all 0.2s ease;
        }
        .drop-zone.drag-over {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-gray-50">
    <div class="min-h-full">
        <!-- Navigation -->
        <nav class="bg-gray-800">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-3 py-3 sm:h-16 sm:flex-nowrap sm:py-0">
                    <div class="order-1 flex-shrink-0">
                        <span class="text-2xl font-bold text-white">DTAT OCR</span>
                        <span class="ml-2 text-sm text-gray-400">Ducktape and Twine</span>
                    </div>
                    <div class="order-3 flex w-full items-baseline gap-1 overflow-x-auto pb-1 sm:order-2 sm:ml-6 sm:w-auto sm:flex-1 sm:pb-0">
                        <a href="/" class="{% if active_page == 'home' %}bg-gray-900 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %} shrink-0 rounded-md px-3 py-2 text-sm font-medium">
                            Process
                        </a>
                        <a href="/ui/documents" class="{% if active_page == 'documents' %}bg-gray-900 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %} shrink-0 rounded-md px-3 py-2 text-sm font-medium">
                            Documents
                        </a>
                        <a href="/ui/settings" class="{% if active_page == 'settings' %}bg-gray-900 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %} shrink-0 rounded-md px-3 py-2 text-sm font-medium">
                            Settings
                        </a>
                        <a href="/ui/api-docs" class="{% if active_page == 'api-docs' %}bg-gray-900 text-white{% else %}text-gray-300 hover:bg-gray-700 hover:text-white{% endif %} shrink-0 rounded-md px-3 py-2 text-sm font-medium">
                            API Docs
                        </a>
                    </div>
                    <div class="order-2 flex flex-shrink-0 items-center sm:order-3">
                        <div id="health-status" hx-get="/api/health-badge" hx-trigger="load, every 30s" hx-swap="innerHTML">
                            <span class="inline-flex items-center rounded-full bg-gray-600 px-2.5 py-0.5 text-xs font-medium text-white">
                                Loading...
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <!-- Main content -->
        <main class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
            {% block content %}{% endblock %}
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
